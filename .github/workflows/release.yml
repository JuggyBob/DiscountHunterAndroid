name: Release

# Builds a release APK and attaches it to a GitHub Release.
#
# Trigger it by pushing an annotated tag matching `v*`:
#
#     git tag -a v1.1.0 -m "v1.1.0"
#     git push origin v1.1.0
#
# Or run it by hand from the Actions tab.
#
# The APK is unsigned unless you add a keystore as a repository secret (see the
# commented step below). Unsigned release APKs still install — Android asks you to
# allow installation from your file manager — which is why this repository ships
# plain APKs rather than going through Google Play.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to build and release (e.g. v1.1.0)'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    name: Build and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate the Gradle wrapper
        uses: gradle/actions/wrapper-validation@v4

      - name: Determine version
        id: version
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Verify the tag matches the build version
        # Catches the most common release mistake: tagging v1.2.0 when the build
        # still says 1.1.0, so the APK reports a version the tag does not have.
        run: |
          DECLARED=$(grep -oP 'versionName\s*=\s*"\K[^"]+' app/build.gradle.kts | head -1 | sed 's/-release$//')
          EXPECTED="${{ steps.version.outputs.name }}"
          echo "build.gradle.kts says: $DECLARED"
          echo "tag says:              $EXPECTED"
          if [ "$DECLARED" != "$EXPECTED" ]; then
            echo "::error::Tag $EXPECTED does not match versionName $DECLARED in app/build.gradle.kts"
            exit 1
          fi

      - name: Run tests before packaging
        # Never ship a red build, however tempting the tag feels.
        run: ./gradlew testDebugUnitTest lintDebug --stacktrace

      # ------------------------------------------------------------------ signing
      #
      # The keystore lives in a repository secret, never in the repository. `assembleRelease`
      # without one falls back to the shared debug key, which produces an APK that installs but
      # cannot be upgraded over an existing install — so a signed build is not a nicety here, it is
      # the difference between "updatable" and "you have to uninstall first".
      #
      # The values are handed to the build as environment variables rather than written into
      # `keystore.properties`, because `app/build.gradle.kts` already reads `STORE_FILE`,
      # `STORE_PASSWORD`, `KEY_ALIAS` and `KEY_PASSWORD` from the environment as a fallback. That
      # keeps the secret out of the filesystem entirely, and keeps the signing configuration in one
      # place instead of a second, divergent one in this workflow.
      - name: Restore the signing key
        # No `if:` here on purpose. Conditioning a step on `secrets` is something the workflow
        # parser is unhappy about, and the condition is not needed: a missing secret is a failure,
        # not a reason to publish a differently-signed build. The check lives inside the script,
        # where it is a plain shell test.
        env:
          KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::RELEASE_KEYSTORE_BASE64 is not set, so the release would be signed with the debug key."
            echo "::error::Add the keystore as a repository secret and re-run the release."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > release-key.p12
          # Written to $GITHUB_ENV, not echoed: the value goes into the file, not the log.
          echo "STORE_FILE=$GITHUB_WORKSPACE/release-key.p12" >> "$GITHUB_ENV"
          echo "KEY_ALIAS=key0" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=$STORE_PASSWORD" >> "$GITHUB_ENV"
          echo "the signing key has been restored"


      - name: Build release APK
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify the signature
        # A release that is not signed with the release key is worse than no release: it installs
        # once and then refuses to update. Checked here, before anything is published.
        run: |
          APKSIGNER=$(ls "$ANDROID_HOME"/build-tools/*/apksigner | tail -1)
          "$APKSIGNER" verify --print-certs app/build/outputs/apk/release/*.apk
          echo "signature verified"

      - name: Rename the APK with its version
        # `1.1.0.apk` in the downloads list beats `app-release.apk`.
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/*.apk "dist/discount-hunter-${{ steps.version.outputs.name }}.apk"
          ls -la dist/

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Discount Hunter ${{ steps.version.outputs.name }}
          generate_release_notes: true
          files: dist/*.apk
          body: |
            ## Discount Hunter ${{ steps.version.outputs.name }}

            See [CHANGELOG.md](CHANGELOG.md) for what changed.

            ### Installing

            The APK is signed with the release key, so it installs over any earlier version
            without an uninstall. If your device warns about an unknown source, allow your file
            manager to install apps — that is the one prompt Android asks for.

            ### Verifying the build

            `ubuntu-latest`, JDK 17, `./gradlew testDebugUnitTest lintDebug assembleRelease`.
            Every APK here was produced by that exact command, and its signature is verified
            before it is published.
