name: CI

# Runs on every push and every pull request. This is the gate: branch protection
# on `main` requires this workflow to pass, so a red build cannot be merged.
#
# The suite is unit tests only — the app has no instrumented tests, and the parts
# that historically broke (Compose list keys, animation, threading) are all
# reachable from plain JVM tests because the logic was kept out of the framework.

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch:

# A new push to the same branch cancels the previous run: nobody wants to wait
# for a stale build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          # Temurin is the JDK this project is built against; the Gradle wrapper
          # needs a JDK even though the app targets JVM 11 bytecode.
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}

      - name: Validate the Gradle wrapper
        # Protects against a compromised or accidentally edited wrapper JAR.
        uses: gradle/actions/wrapper-validation@v4

      - name: Compile Kotlin
        run: ./gradlew compileDebugKotlin --stacktrace

      - name: Run unit tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Upload test report
        # Visible in the PR without anyone having to pull the build down.
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/
          retention-days: 14

      - name: Run Android Lint
        run: ./gradlew lintDebug --stacktrace

      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-report
          path: app/build/reports/lint-results-debug.html
          retention-days: 14

      - name: Build debug and release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14
