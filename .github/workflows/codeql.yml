name: CodeQL

# Static analysis for Kotlin/Java. CodeQL is what catches the classes of bug a
# unit test never will: path traversal in the diagnostics exporter, unsafe
# deserialisation in the JSON parsers, injection into anything that handles store
# HTML.
#
# Runs weekly and on demand as well as on push, so it has time to surface issues
# in code that has not changed recently.

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  schedule:
    # Mondays at 03:17 UTC. Deliberately not midnight — every scheduled workflow
    # in the world fires then and GitHub queues them.
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # Required to upload the analysis results. Without it the action logs
  # "does not have permission to access the CodeQL Action API endpoints" and
  # the run reports failure even when the analysis itself succeeded.
  security-events: write
  actions: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    # Let a newer CodeQL ship rather than failing the run against a stale one.
    timeout-minutes: 60

    strategy:
      fail-fast: false
      matrix:
        language: [ 'java-kotlin' ]

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The build comes BEFORE the analysis, and the order matters.
      #
      # CodeQL extracts source through the compiler's call graph, so it has to
      # watch a real compile happen. Running `analyze` first — which is what this
      # file originally did — fails with "CodeQL detected code written in
      # Java/Kotlin but could not process any of it", because there is nothing to
      # process. The two steps are in this order on purpose.
      - name: Build
        run: ./gradlew assembleDebug --stacktrace

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          queries: security-and-quality

      - name: Perform CodeQL analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: '/language:${{ matrix.language }}'
