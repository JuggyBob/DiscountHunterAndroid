# Project-wide Gradle settings for Discount Hunter (Android).

# JVM used for the Gradle daemon. 4 GB is comfortable for Compose + Kotlin compilation.
org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8

# Build performance.
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4

# Run the Kotlin compiler in-process: avoids spawning (and losing) the Kotlin compile daemon.
kotlin.compiler.execution.strategy=in-process

# Idiomatic Kotlin style.
kotlin.code.style=official

# Each library keeps its own R class, so only this module's resources are visible to it.
android.nonTransitiveRClass=true

# Keep the configuration cache off: AGP's built-in Kotlin support still invalidates it often
# enough that the extra disk churn is not worth it for a single-module project.
org.gradle.configuration-cache=false

# Enabled parallel sync for Gradle 9.4+
org.gradle.tooling.parallel=true
